<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSphere</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div class="logo">Job<span>Sphere</span></div>
    <nav>
        <a href="#jobs">Jobs</a>
        <button id="loginButton" onclick="showLogin()">Login</button>
        <button id="logoutButton" class="hidden" onclick="logout()">Logout</button>
    </nav>
</header>

<section class="hero">
    <p class="eyebrow">JAVA • SPRING BOOT • JWT • MYSQL</p>
    <h1>Find the right job.<br>Build your career.</h1>
    <p>Search jobs, apply online and track your applications.</p>
    <a href="#jobs">Explore Jobs</a>
</section>

<section id="jobs">
    <div class="section-head">
        <div>
            <h2>Latest Jobs</h2>
            <p>Search and apply for active opportunities.</p>
        </div>
        <input id="searchBox" placeholder="Search by job title" oninput="loadJobs()">
    </div>
    <div id="jobList" class="grid"></div>
</section>

<section>
    <div class="panel">
        <h2>My Applications</h2>
        <div id="applications">Login as a candidate to see your applications.</div>
    </div>
</section>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
